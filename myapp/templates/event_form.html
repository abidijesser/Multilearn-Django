<form id="eventForm" method="post" enctype="multipart/form-data" action="{% if event %}{% url 'event_edit' event.id %}{% else %}{% url 'event_create' %}{% endif %}">
    {% csrf_token %}

    <div id="formErrors"></div>

    <div class="mb-3">
        <label for="id_title" class="form-label">Titre *</label>
        <input type="text" class="form-control" id="id_title" name="title" value="{{ event.title|default:form.title.value|default:'' }}" required>
        <div class="invalid-feedback"></div>
    </div>

    <div class="mb-3">
        <label for="id_description" class="form-label">Description</label>
        <textarea class="form-control" id="id_description" name="description" rows="3">{{ event.description|default:form.description.value|default:'' }}</textarea>
        <div class="invalid-feedback"></div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="id_start_time" class="form-label">Date & heure début *</label>
            <input type="datetime-local" class="form-control" id="id_start_time" name="start_time"
                   value="{% if event and event.start_time %}{{ event.start_time|date:'Y-m-d\\TH:i' }}{% else %}{{ form.start_time.value|default:'' }}{% endif %}" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-6 mb-3">
            <label for="id_end_time" class="form-label">Date & heure fin *</label>
            <input type="datetime-local" class="form-control" id="id_end_time" name="end_time"
                   value="{% if event and event.end_time %}{{ event.end_time|date:'Y-m-d\\TH:i' }}{% else %}{{ form.end_time.value|default:'' }}{% endif %}" required>
            <div class="invalid-feedback"></div>
        </div>
    </div>

    <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="id_is_online" name="is_online"
               {% if event and event.is_online %}checked{% elif form.is_online.value %}checked{% endif %}>
        <label class="form-check-label" for="id_is_online">Événement en ligne</label>
    </div>

    <div class="mb-3" id="location-field">
        <label for="id_location" class="form-label">Lieu</label>
        <input type="text" class="form-control" id="id_location" name="location" value="{{ event.location|default:form.location.value|default:'' }}">
        <div class="invalid-feedback"></div>
    </div>

    <div class="mb-3">
        <label for="id_image" class="form-label">Image de l'événement (optionnel)</label>
        <input type="file" class="form-control" id="id_image" name="image" accept="image/*">
        <div class="invalid-feedback"></div>
        {% if event and event.image %}
        <small class="text-muted d-block mt-1">Image actuelle: <a href="{{ event.image.url }}" target="_blank">voir</a></small>
        {% endif %}
    </div>

    <div class="mb-3">
        <label for="id_max_participants" class="form-label">Nombre maximum de participants</label>
        <input type="number" min="1" class="form-control" id="id_max_participants" name="max_participants" value="{{ event.max_participants|default:form.max_participants.value|default:'' }}" placeholder="Illimité si vide">
        <div class="invalid-feedback"></div>
    </div>

    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-primary">{% if event %}Modifier{% else %}Enregistrer{% endif %}</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const startInput = document.getElementById('id_start_time');
    const endInput = document.getElementById('id_end_time');

    const toLocalDatetime = (d) => {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    const now = new Date();
    if (startInput && !startInput.min) startInput.min = toLocalDatetime(now);
    if (endInput && !endInput.min) endInput.min = toLocalDatetime(now);

    startInput?.addEventListener('change', () => {
        if (!endInput) return;
        const minForEnd = startInput.value || toLocalDatetime(new Date());
        endInput.min = minForEnd;
        if (endInput.value && endInput.value < minForEnd) {
            endInput.value = minForEnd;
        }
    });
});
</script>
