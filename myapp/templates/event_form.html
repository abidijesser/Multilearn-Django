<form id="eventForm" method="post" action="{% if event %}{% url 'event_edit' event.id %}{% else %}{% url 'event_create' %}{% endif %}">
    {% csrf_token %}

    <div id="formErrors"></div>

    <div class="mb-3">
        <label for="id_title" class="form-label">Titre *</label>
        <input type="text" class="form-control" id="id_title" name="title" value="{{ event.title|default:form.title.value|default:'' }}" required>
        <div class="invalid-feedback"></div>
    </div>

    <div class="mb-3">
        <label for="id_description" class="form-label">Description</label>
        <textarea class="form-control" id="id_description" name="description" rows="3">{{ event.description|default:form.description.value|default:'' }}</textarea>
        <div class="invalid-feedback"></div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="id_start_time" class="form-label">Date & heure début *</label>
            <input type="datetime-local" class="form-control" id="id_start_time" name="start_time"
                   value="{% if event and event.start_time %}{{ event.start_time|date:'Y-m-d\\TH:i' }}{% else %}{{ form.start_time.value|default:'' }}{% endif %}" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-6 mb-3">
            <label for="id_end_time" class="form-label">Date & heure fin *</label>
            <input type="datetime-local" class="form-control" id="id_end_time" name="end_time"
                   value="{% if event and event.end_time %}{{ event.end_time|date:'Y-m-d\\TH:i' }}{% else %}{{ form.end_time.value|default:'' }}{% endif %}" required>
            <div class="invalid-feedback"></div>
        </div>
    </div>

    <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="id_is_online" name="is_online"
               {% if event and event.is_online %}checked{% elif form.is_online.value %}checked{% endif %}>
        <label class="form-check-label" for="id_is_online">Événement en ligne</label>
    </div>

    <div class="mb-3" id="location-field">
        <label for="id_location" class="form-label">Lieu</label>
        <input type="text" class="form-control" id="id_location" name="location" value="{{ event.location|default:form.location.value|default:'' }}">
        <div class="invalid-feedback"></div>
    </div>

    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-primary">{% if event %}Modifier{% else %}Enregistrer{% endif %}</button>
    </div>
</form>
